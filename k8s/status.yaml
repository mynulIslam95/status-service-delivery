apiVersion: v1
kind: ConfigMap
metadata:
  name: status-config
  labels:
    app: northfield-status
data:
  APP_VERSION: "1.0.0"
  STATUS_FAIL: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northfield-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: northfield-status
  template:
    metadata:
      labels:
        app: northfield-status
    spec:
      containers:
        - name: app
          image: northfield-status:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: status-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: northfield-status
spec:
  selector:
    app: northfield-status
  ports:
    - port: 8080
      targetPort: 8080
