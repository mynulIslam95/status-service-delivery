name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest tests/test_health.py
      - name: image
        run: docker build -t northfield-status:ci ./app
      - name: compose health
        run: |
          docker compose up -d app
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: stop
        if: always()
        run: docker compose down
